<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="form-container">
      <h1>Zodiac Sign Form</h1>

      <label for="zodiac-sign">Choose your zodiac sign:</label>

      <select id="zodiac-sign">
        <option value="">Select your sign</option>
        <option value="Aries">Aries</option>
        <option value="Taurus">Taurus</option>
        <option value="Gemini">Gemini</option>
        <option value="Cancer">Cancer</option>
        <option value="Leo">Leo</option>
        <option value="Virgo">Virgo</option>
        <option value="Libra">Libra</option>
        <option value="Scorpio">Scorpio</option>
        <option value="Sagittarius">Sagittarius</option>
        <option value="Capricorn">Capricorn</option>
        <option value="Aquarius">Aquarius</option>
        <option value="Pisces">Pisces</option>
      </select>

      <button>Submit</button>
    </div>

    <div id="horoscope-results" class="results-container">
      <img id="zodiac-img" alt="Zodiac sign" />

      <p>Your sign is <span id="sign"></span>.</p>

      <p>
        The date range for <span id="date-sign"></span> is
        <span id="date-range"></span>.
      </p>

      <p>
        Your horoscope today is
        <span id="daily-horoscope"></span>
      </p>
    </div>
    <script src="js/custom.js"></script>
  </body>
</html>
